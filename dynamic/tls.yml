tls:
  certificates:
    - certFile: /gitea_deploy/certs/ 
      keyFile:  /gitea_deploy/certs/ 
  
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 ## chiffrement des données
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ## hachage